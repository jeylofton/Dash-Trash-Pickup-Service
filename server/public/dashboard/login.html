<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · {{brand.name}}</title>
<link rel="icon" type="image/png" href="/images/logo/favicon-32.png" />
<link rel="stylesheet" href="/dashboard/dash.css" />
<script type="module" src="/brand-hydrate.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="/images/logo/mark-128.png" alt="" />
        <span>{{brand.name}}<small class="muted small" style="display:block;font-weight:700">Staff &amp; customer portal</small></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p class="msg error" id="loginError" hidden></p>
        <button class="btn btn-primary" style="width:100%" type="submit" id="loginBtn">Sign in</button>
      </form>

      <!-- Demo accounts are injected here by login.js, and only in development
           (the /api/dev-demo endpoint 404s in production). Nothing about the
           demo - least of all the password - ships in the live page source. -->
      <div class="demo-creds" id="demoCreds" hidden></div>
    </div>
  </div>

<script type="module" src="/dashboard/login.js"></script>
</body>
</html>
