<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Choose a password · Dash Trash Pickup</title>
<link rel="icon" type="image/png" href="/images/logo/favicon-32.png" />
<link rel="stylesheet" href="/dashboard/dash.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="/images/logo/mark-128.png" alt="" />
        <span>Choose a password<small class="muted small" style="display:block;font-weight:700">Required before you continue</small></span>
      </div>

      <p class="msg" style="background:rgba(250,178,25,.16);color:#8a5f05">
        Your account is using a temporary password. Pick your own to continue.
      </p>

      <form id="pwForm" novalidate>
        <div class="field">
          <label for="current">Temporary password</label>
          <input id="current" type="password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="next">New password</label>
          <input id="next" type="password" autocomplete="new-password" required />
          <p class="muted small" style="margin:5px 0 0">At least 10 characters, with letters and numbers.</p>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input id="confirm" type="password" autocomplete="new-password" required />
        </div>
        <p class="msg error" id="pwError" hidden></p>
        <p class="msg ok" id="pwOk" hidden></p>
        <button class="btn btn-primary" style="width:100%" id="pwBtn" type="submit">Set my password</button>
      </form>
    </div>
  </div>

<script type="module">
  import { api, $ } from '/dashboard/dash.js';

  $('#pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('#pwError'), ok = $('#pwOk'), btn = $('#pwBtn');
    err.hidden = true; ok.hidden = true;

    if ($('#next').value !== $('#confirm').value) {
      err.textContent = 'The two new passwords do not match.'; err.hidden = false; return;
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await api('/api/auth/change-password', {
        method: 'POST',
        body: JSON.stringify({ currentPassword: $('#current').value, newPassword: $('#next').value }),
      });
      ok.textContent = res.message || 'Password updated. Please sign in again.';
      ok.hidden = false;
      setTimeout(() => { location.href = '/dashboard/login.html'; }, 1600);
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false;
      btn.disabled = false; btn.textContent = 'Set my password';
    }
  });
</script>
</body>
</html>
